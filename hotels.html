```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotels - TripBook</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#222;
}

header{
  background:white;
  padding:16px 7%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.logo{
  color:#e53935;
  font-size:28px;
  font-weight:bold;
  text-decoration:none;
}

header a{
  text-decoration:none;
  color:#333;
  font-weight:600;
}

.search-bar{
  background:white;
  padding:20px 7%;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.search-form{
  max-width:1100px;
  margin:auto;
  display:grid;
  grid-template-columns:1.5fr 1fr 1fr 1fr auto;
  gap:10px;
}

input,select{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:7px;
  font-size:14px;
}

button{
  border:none;
  border-radius:7px;
  padding:13px 20px;
  background:#e53935;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.container{
  width:86%;
  max-width:1200px;
  margin:35px auto;
}

.heading{
  margin-bottom:25px;
}

.heading h1{
  font-size:30px;
  margin-bottom:7px;
}

.heading p{
  color:#666;
}

.hotel-list{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px;
}

.hotel-card{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 3px 14px rgba(0,0,0,.08);
}

.hotel-image{
  height:190px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#ddd;
  font-size:55px;
}

.hotel-image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.hotel-info{
  padding:18px;
}

.hotel-info h2{
  font-size:20px;
  margin-bottom:8px;
}

.location{
  color:#666;

  margin-bottom:10px;
}

.description{
  color:#666;
  font-size:13px;

.rating{
  margin-bottom:12px;

.rating span{
  background:#198754;

    grid-template-columns:1fr;

</head>

<body>

<header>
<a href="index.html" class="logo">TripBook</a>
<a href="index.html">← Back to Home</a>
</header>

<section class="search-bar">

<form class="search-form" id="searchForm">

<input
type="text"
placeholder="Destination"
id="destination">

<input type="date" id="checkin">

<input type="date" id="checkout">

<select id="guests">
<option>1 Guest, 1 Room</option>
<option>2 Guests, 1 Room</option>
<option>2 Guests, 2 Rooms</option>
<option>3 Guests, 1 Room</option>
<option>4 Guests, 2 Rooms</option>
</select>

<button type="submit">Search</button>

</form>

</section>

<main class="container">

<div class="heading">
<h1>Hotels</h1>
<p id="resultText">Find the right stay for your journey</p>
</div>

<div class="hotel-list" id="hotelList">
<div class="loading">
Loading hotels...
</div>
</div>

</main>

<footer>
<h2>TripBook</h2>
<p>Your journey starts here.</p>
<p>© 2026 TripBook</p>
</footer>

<script>

const SUPABASE_URL =
"https://utrlprmobpbgcyajwfcs.supabase.co";

const SUPABASE_KEY =
"sb_publishable_gpMN8lRI0-MDtNF1Wk7-Bg_HDVnfTdn";

const hotelList =
document.getElementById("hotelList");

const searchForm =
document.getElementById("searchForm");

const destinationInput =
document.getElementById("destination");

const resultText =
document.getElementById("resultText");


async function loadHotels(destination=""){

hotelList.innerHTML=`
<div class="loading">
Loading hotels...
</div>
`;

try{

let url=
SUPABASE_URL+
"/rest/v1/hotels?available=eq.true&select=*";

if(destination.trim()!==""){

const city=
encodeURIComponent(destination.trim());

url+="&city=ilike."+city;

}

url+="&order=id.asc";


const response=await fetch(url,{
method:"GET",
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY
}
});


if(!response.ok){

throw new Error(
await response.text()
);

}


const hotels=await response.json();


if(!hotels.length){

hotelList.innerHTML=`
<div class="no-results">
<h2>No hotels found</h2>
<p style="margin-top:8px">
Try another destination.
</p>
</div>
`;

resultText.textContent=
"No hotels found for this destination.";

return;
}


resultText.textContent=
hotels.length+" hotel(s) available";

hotelList.innerHTML="";


hotels.forEach(hotel=>{

const price=
Number(hotel.price_per_night||0);

const rating=
Number(hotel.rating||0);


const imageHTML=
hotel.image_url
? `<img src="${escapeHTML(hotel.image_url)}" alt="${escapeHTML(hotel.name)}">`
: `🏨`;


const card=
document.createElement("div");

card.className="hotel-card";


card.innerHTML=`

<div class="hotel-image">
${imageHTML}
</div>

<div class="hotel-info">

<h2>
${escapeHTML(hotel.name)}
</h2>

<div class="location">
📍 ${escapeHTML(hotel.city)}, ${escapeHTML(hotel.country)}
</div>

<div class="description">
${escapeHTML(hotel.description||"")}
</div>

<div class="rating">
<span>${rating.toFixed(1)}</span>
⭐⭐⭐⭐⭐
</div>

<div class="price">
${formatPrice(price)}
</div>

<div class="tax">
per night · taxes may apply
</div>

<button
class="view-btn"
onclick="viewHotel(${hotel.id})">
View Rooms
</button>

</div>
`;

hotelList.appendChild(card);

});

}

catch(error){

console.error(error);

hotelList.innerHTML=`
<div class="error">
<h2>Unable to load hotels</h2>
<p style="margin-top:8px">
Please try again.
</p>
</div>
`;

resultText.textContent=
"There was a problem loading hotels.";

}

}


function viewHotel(id){

location.href=
"hotel.html?id="+
encodeURIComponent(id);

}


searchForm.addEventListener(
"submit",
function(event){

event.preventDefault();

const destination=
destinationInput.value.trim();

loadHotels(destination);

});


function formatPrice(price){

if(!price||price<=0){
return "Price unavailable";
}

return "₹"+
price.toLocaleString("en-IN",{
maximumFractionDigits:0
});

}


function escapeHTML(value){

return String(value||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


const params=
new URLSearchParams(window.location.search);

const destination=
params.get("destination");


if(destination){

destinationInput.value=
destination;

loadHotels(destination);

}else{

loadHotels();

}

</script>

</body>
</html>
