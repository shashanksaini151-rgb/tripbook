<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hotel Details - TripBook</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#222;
}

header{
  background:#fff;
  padding:16px 7%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.logo{
  font-size:28px;
  font-weight:bold;
  color:#e53935;
  text-decoration:none;
}

header a{
  text-decoration:none;
  color:#333;
  font-weight:bold;
}

.container{
  width:86%;
  max-width:1100px;
  margin:30px auto;
}

.hotel-title{
  background:#fff;
  padding:25px;
  border-radius:12px;
  margin-bottom:20px;
}

.hotel-title h1{
  margin-bottom:10px;
}

.location{
  color:#666;
}

.notice{
  background:#e8f5e9;
  padding:15px;
  border-radius:8px;
  margin-bottom:20px;
  color:#256029;
  line-height:1.5;
}

.gallery{
  display:grid;
  grid-template-columns:2fr 1fr 1fr;
  gap:10px;
  margin-bottom:25px;
}

.photo{
  height:220px;
  background:linear-gradient(135deg,#ddd,#aaa);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:60px;
  border-radius:10px;
  overflow:hidden;
}

.photo:first-child{
  height:450px;
  grid-row:span 2;
}

.rooms{
  display:grid;
  gap:18px;
}

.room{
  background:#fff;
  padding:22px;
  border-radius:12px;
  box-shadow:0 3px 15px rgba(0,0,0,.07);
}

.room h2{
  margin-bottom:10px;
}

.room p{
  color:#666;
  margin:7px 0;
}

.price{
  font-size:24px;
  font-weight:bold;
  margin:15px 0;
}

.book{
  background:#e53935;
  color:white;
  border:0;
  padding:13px 25px;
  border-radius:7px;
  font-weight:bold;
  cursor:pointer;
}

.book:hover{
  background:#c62828;
}

.book:disabled{
  background:#aaa;
  cursor:not-allowed;
}

.available{
  color:#2e7d32 !important;
  font-weight:bold;
}

.unavailable{
  color:#c62828 !important;
  font-weight:bold;
}

.loading,
.error{
  background:#fff;
  padding:30px;
  border-radius:12px;
  text-align:center;
}

.error{
  color:#c62828;
}

footer{
  margin-top:50px;
  background:#171717;
  color:white;
  text-align:center;
  padding:30px;
}

@media(max-width:700px){

.container{
  width:92%;
}

.gallery{
  grid-template-columns:1fr 1fr;
}

.photo:first-child{
  grid-column:span 2;
  height:250px;
}

.photo{
  height:150px;
}

header{
  padding:15px 5%;
}

.logo{
  font-size:24px;
}

}
</style>
</head>

<body>

<header>

<a href="index.html" class="logo">
TripBook
</a>

<a href="hotels.html">
← Back to Hotels
</a>

</header>

<main class="container">

<div id="hotelContent">

<div class="loading">
Loading hotel details...
</div>

</div>

</main>

<footer>

<h2>TripBook</h2>

<p style="margin-top:8px;color:#bbb">
Your journey starts here.
</p>

<p style="margin-top:8px;color:#bbb">
© 2026 TripBook
</p>

</footer>

<script>

const SUPABASE_URL =
"https://utrlprmobpbgcyajwfcs.supabase.co";

const SUPABASE_KEY =
"sb_publishable_gpMN8lRI0-MDtNF1Wk7-Bg_HDVnfTdn";

const hotelContent =
document.getElementById("hotelContent");


function escapeHTML(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
   LOAD HOTEL + ROOMS
========================= */

async function loadHotel(){

const params =
new URLSearchParams(window.location.search);

const hotelId =
params.get("id");


if(!hotelId){

hotelContent.innerHTML = `
<div class="error">

<h2>Hotel not found</h2>

<p style="margin-top:10px">
Please select a hotel from the hotel list.
</p>

</div>
`;

return;

}


try{

/* =========================
   GET HOTEL
========================= */

const hotelUrl =
SUPABASE_URL +
"/rest/v1/hotels?id=eq." +
encodeURIComponent(hotelId) +
"&available=eq.true&select=*";


const hotelResponse =
await fetch(hotelUrl,{

method:"GET",

headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY
}

});


if(!hotelResponse.ok){

throw new Error(
await hotelResponse.text()
);

}


const hotels =
await hotelResponse.json();


if(!hotels.length){

throw new Error(
"Hotel not found."
);

}


const hotel =
hotels[0];


/* =========================
   GET ROOMS
========================= */

const roomsUrl =
SUPABASE_URL +
"/rest/v1/rooms?hotel_id=eq." +
encodeURIComponent(hotelId) +
"&select=id,hotel_id,room_name,price_per_night,max_guests,available_rooms&order=price_per_night.asc";


const roomsResponse =
await fetch(roomsUrl,{

method:"GET",

headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY
}

});


if(!roomsResponse.ok){

throw new Error(
await roomsResponse.text()
);

}


const rooms =
await roomsResponse.json();


/* =========================
   HOTEL INFORMATION
========================= */

const rating =
Number(hotel.rating || 0);


const hotelName =
escapeHTML(hotel.name);


const city =
escapeHTML(hotel.city);


const country =
escapeHTML(hotel.country);


const description =
escapeHTML(
hotel.description ||
"Comfortable stay for your journey."
);


/* =========================
   HOTEL IMAGE
========================= */

const image =
hotel.image_url
?
`<img
src="${escapeHTML(hotel.image_url)}"
alt="${hotelName}"
style="width:100%;height:100%;object-fit:cover;border-radius:10px;"
onerror="this.style.display='none';this.parentElement.innerHTML='🏨';">`
:
"🏨";


/* =========================
   ROOMS HTML
========================= */

let roomsHTML = "";


if(!rooms.length){

roomsHTML = `
<div class="room">

<h2>No rooms available</h2>

<p>
Sorry, rooms are currently unavailable for this hotel.
</p>

</div>
`;

}else{

rooms.forEach(room => {

const roomName =
escapeHTML(room.room_name);

const roomPrice =
Number(room.price_per_night || 0);

const maxGuests =
Number(room.max_guests || 0);

const availableRooms =
Number(room.available_rooms || 0);

const isAvailable =
availableRooms > 0;


roomsHTML += `

<div class="room">

<h2>
🛏️ ${roomName}
</h2>

<p>
👥 Maximum guests: ${maxGuests}
</p>

<p>
❄️ Air Conditioning · Wi-Fi · Private Bathroom
</p>

<p class="${isAvailable ? "available" : "unavailable"}">

${
isAvailable
?
"🟢 " + availableRooms + " rooms available"
:
"🔴 Currently unavailable"
}

</p>

<div class="price">

${
roomPrice > 0
?
"₹" + roomPrice.toLocaleString("en-IN")
:
"Price unavailable"
}

<small style="font-size:13px">
/ night
</small>

</div>

<button
class="book"
${!isAvailable ? "disabled" : ""}
onclick="bookRoom(${room.id},${hotel.id})">

${isAvailable ? "Book Now" : "Unavailable"}

</button>

</div>

`;

});

}


/* =========================
   DISPLAY PAGE
========================= */

hotelContent.innerHTML = `

<div class="hotel-title">

<h1>${hotelName}</h1>

<div class="location">
📍 ${city}, ${country}
</div>

<p style="margin-top:10px">

⭐ ${
rating > 0
? rating.toFixed(1)
: "New"
}

· ${description}

</p>

</div>


<div class="notice">

<strong>TripBook Hotel</strong><br>

Hotel information, rooms and pricing are
loaded directly from TripBook's database.

</div>


<div class="gallery">

<div class="photo">
${image}
</div>

<div class="photo">🛏️</div>

<div class="photo">🛁</div>

<div class="photo">🌆</div>

<div class="photo">🍽️</div>

</div>


<h2 style="margin-bottom:18px">
Choose your room
</h2>


<div class="rooms">

${roomsHTML}

</div>

`;

}

catch(error){

console.error(error);

hotelContent.innerHTML = `

<div class="error">

<h2>
Unable to load hotel
</h2>

<p style="margin-top:10px">
${escapeHTML(
error.message ||
"Unknown error"
)}
</p>

</div>

`;

}

}


/* =========================
   BOOK ROOM
========================= */

function bookRoom(roomId,hotelId){

window.location.href =
"booking.html?hotel_id=" +
encodeURIComponent(hotelId) +
"&room_id=" +
encodeURIComponent(roomId);

}


loadHotel();

</script>

</body>
</html>
