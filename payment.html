<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TripBook - Payment</title>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #007bff, #00b4d8);
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin-bottom: 5px;
    }

    .container {
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    .card h2 {
      margin-bottom: 15px;
      color: #007bff;
    }

    .info {
      margin: 12px 0;
      font-size: 16px;
    }

    .price {
      font-size: 28px;
      font-weight: bold;
      color: #0a8f3c;
      margin: 20px 0;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #007bff;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .success {
      text-align: center;
      color: #0a8f3c;
    }

    .error {
      margin-top: 15px;
      color: #d00000;
      text-align: center;
    }

    .test-note {
      margin-top: 20px;
      padding: 12px;
      background: #fff3cd;
      border-radius: 8px;
      color: #664d03;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  <h1>TripBook</h1>
  <p>Secure Hotel Booking</p>
</header>

<div class="container">

  <div class="card" id="paymentCard">

    <h2>Confirm Your Booking</h2>

    <div class="info">
      <strong>Hotel:</strong>
      <span id="hotelName">Loading...</span>
    </div>

    <div class="info">
      <strong>Room:</strong>
      <span id="roomName">Loading...</span>
    </div>

    <div class="info">
      <strong>Room ID:</strong>
      <span id="roomId">Loading...</span>
    </div>

    <div class="price">
      ₹<span id="roomPrice">0</span> / night
    </div>

    <button id="payButton" onclick="startPayment()" disabled>
      Loading Payment...
    </button>

    <div class="test-note">
      Test Mode: No real money will be charged.
    </div>

    <div class="error" id="errorMessage"></div>

  </div>

</div>

<script>

const SUPABASE_URL =
  "https://utrlprmobpbgcyajwfcs.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_gpMN8lRI0-MDtNF1Wk7-Bg_HDVnfTdn";

const RAZORPAY_KEY_ID =
  "rzp_test_TYgp9CQra046cp";

const CREATE_ORDER_URL =
  "https://utrlprmobpbgcyajwfcs.supabase.co/functions/v1/create-razorpay-order";


const params = new URLSearchParams(window.location.search);

const hotelId = params.get("hotel_id");
const roomId = params.get("room_id");


let hotel = null;
let room = null;


async function loadPaymentDetails() {

  try {

    if (!hotelId || !roomId) {
      throw new Error("Hotel ID or Room ID missing.");
    }

    // Get hotel
    const hotelResponse = await fetch(
      `${SUPABASE_URL}/rest/v1/hotels?id=eq.${hotelId}&select=*`,
      {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    if (!hotelResponse.ok) {
      throw new Error("Unable to load hotel.");
    }

    const hotels = await hotelResponse.json();

    if (!hotels.length) {
      throw new Error("Hotel not found.");
    }

    hotel = hotels[0];


    // Get room
    const roomResponse = await fetch(
      `${SUPABASE_URL}/rest/v1/rooms?id=eq.${roomId}&select=*`,
      {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    if (!roomResponse.ok) {
      throw new Error("Unable to load room.");
    }

    const rooms = await roomResponse.json();

    if (!rooms.length) {
      throw new Error("Room not found.");
    }

    room = rooms[0];


    document.getElementById("hotelName").textContent =
      hotel.name || "Hotel";

    document.getElementById("roomName").textContent =
      room.room_name || "Room";

    document.getElementById("roomId").textContent =
      room.id;

    document.getElementById("roomPrice").textContent =
      Number(room.price_per_night).toLocaleString("en-IN");


    document.getElementById("payButton").disabled = false;

    document.getElementById("payButton").textContent =
      `Pay ₹${Number(room.price_per_night).toLocaleString("en-IN")}`;


    console.log(
      "Room price loaded successfully: ₹" +
      room.price_per_night
    );

  } catch (error) {

    console.error(error);

    document.getElementById("errorMessage").textContent =
      error.message;

    document.getElementById("payButton").disabled = true;

  }

}


async function startPayment() {

  try {

    if (!room) {
      alert("Room details are still loading.");
      return;
    }


    const button =
      document.getElementById("payButton");

    button.disabled = true;
    button.textContent = "Creating Payment...";


    // Create Razorpay Order
    const response = await fetch(
      CREATE_ORDER_URL,
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`
        },

        body: JSON.stringify({
          room_id: room.id
        })
      }
    );


    const data = await response.json();


    if (!response.ok) {

      throw new Error(
        data.error || "Unable to create Razorpay order."
      );

    }


    console.log("Razorpay Order:", data);


    const options = {

      key: RAZORPAY_KEY_ID,

      amount: data.amount,

      currency: data.currency || "INR",

      name: "TripBook",

      description:
        `${hotel.name} - ${room.room_name}`,

      order_id: data.order_id,


      handler: function (paymentResponse) {

        console.log(
          "Payment Success:",
          paymentResponse
        );


        document.getElementById("paymentCard").innerHTML = `

          <div class="success">

            <h2>🎉 Payment Successful!</h2>

            <p style="margin-top:15px;">
              Your TripBook payment was completed
              successfully in Test Mode.
            </p>

            <p style="margin-top:15px;">
              <strong>Payment ID:</strong><br>
              ${paymentResponse.razorpay_payment_id}
            </p>

            <p style="margin-top:15px;">
              <strong>Order ID:</strong><br>
              ${paymentResponse.razorpay_order_id}
            </p>

            <p style="margin-top:20px;">
              Amount Paid:
              <strong>
                ₹${Number(data.amount / 100).toLocaleString("en-IN")}
              </strong>
            </p>

            <div class="test-note">
              This is Razorpay Test Mode.
              No real money was charged.
            </div>

          </div>

        `;

      },


      modal: {

        ondismiss: function () {

          button.disabled = false;

          button.textContent =
            `Pay ₹${Number(room.price_per_night).toLocaleString("en-IN")}`;

        }

      },


      theme: {
        color: "#007bff"
      }

    };


    const razorpay =
      new Razorpay(options);


    razorpay.on(
      "payment.failed",
      function (response) {

        console.error(
          "Payment failed:",
          response.error
        );

        document.getElementById("errorMessage").textContent =
          response.error.description ||
          "Payment failed.";

        button.disabled = false;

        button.textContent =
          `Pay ₹${Number(room.price_per_night).toLocaleString("en-IN")}`;

      }
    );


    razorpay.open();


  } catch (error) {

    console.error(error);

    document.getElementById("errorMessage").textContent =
      error.message;

    const button =
      document.getElementById("payButton");

    button.disabled = false;

    button.textContent =
      button.textContent =
  `Pay ₹${Number(room.price_per_night).toLocaleString("en-IN")}`;

  }

}


loadPaymentDetails();

</script>

</body>
</html>
